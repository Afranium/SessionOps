services:
  - type: web
    name: sessionops
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/sessionops.db
    disk:
      name: sessionops-data
      mountPath: /var/data
      sizeGB: 1
